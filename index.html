<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Management Dashboard</title>

    <script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>

    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f7fa;
            color: #333;
        }

        .container { max-width: 1300px; margin: 0 auto; }

        .header {
            background: #ffffff;
            padding: 20px 25px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .header h1 { margin: 0 0 4px 0; font-size: 22px; color: #1f2937; }
        .header p { margin: 0; color: #6b7280; font-size: 13px; }

        .header-controls { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }

        .filter-group { display: flex; flex-direction: column; gap: 3px; }
        .filter-group label { font-size: 11px; color: #6b7280; }
        .filter-group.hidden { display: none; }

        .filter-group select {
            padding: 8px 12px;
            border-radius: 6px;
            border: 1px solid #d1d5db;
            font-size: 14px;
            min-width: 190px;
            background: #ffffff;
        }

        #refreshButton {
            background: #2563eb;
            color: #ffffff;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        #refreshButton:disabled { background: #9ca3af; }

        .last-updated { font-size: 12px; color: #6b7280; padding-bottom: 9px; }

        .card-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 10px;
            padding: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }

        .card-title { font-size: 13px; color: #6b7280; margin-bottom: 8px; }
        .card-value { font-size: 26px; font-weight: bold; color: #111827; }
        .card-value.target { color: #7c3aed; }
        .card-value.achieved { color: #059669; }
        .card-value.pending { color: #d97706; }
        .card-value.waiting { color: #9ca3af; font-size: 18px; }
        .card-sub { font-size: 12px; color: #6b7280; margin-top: 6px; min-height: 15px; }
        .card-sub strong { color: #374151; }

        .section {
            background: #ffffff;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 20px;
        }

        .section h2 { margin: 0 0 15px 0; font-size: 17px; color: #1f2937; }

        .table-scroll { overflow-x: auto; }

        table { border-collapse: collapse; width: 100%; }

        th, td {
            border: 1px solid #d0d7de;
            padding: 8px 10px;
            text-align: center;
            font-size: 13px;
        }

        th { background: #1f4e78; color: #ffffff; }

        td.row-label { text-align: left; font-weight: 600; }
        td.row-label .sub { display: block; font-weight: 400; font-size: 11px; color: #6b7280; }

        tr.grand-total { background: #d9eaf7; font-weight: 700; }
        tbody tr:nth-child(even) { background: #f7f9fb; }

        .loading { padding: 30px; text-align: center; color: #6b7280; }
        .error { padding: 15px; background: #fee2e2; border: 1px solid #fecaca; border-radius: 6px; color: #991b1b; font-size: 14px; }

        .card-value.clickable, td.clickable, .funnel-row.clickable { cursor: pointer; }

        .card-value.clickable, td.clickable .big, td.clickable.plain {
            text-decoration: underline;
            text-decoration-style: dotted;
            text-decoration-color: #93c5fd;
        }

        .card-value.clickable:hover, td.clickable:hover { opacity: 0.75; }

        /* ---- Modal ---- */

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.45);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open { display: flex; }

        .modal-box {
            background: #ffffff;
            border-radius: 10px;
            max-width: 500px;
            width: 90%;
            max-height: 70vh;
            display: flex;
            flex-direction: column;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .modal-header {
            padding: 16px 20px;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h3 { margin: 0; font-size: 16px; color: #1f2937; }
        .modal-close { background: none; border: none; font-size: 20px; cursor: pointer; color: #6b7280; line-height: 1; }
        .modal-body { padding: 12px 20px; overflow-y: auto; }
        .modal-body ul { margin: 0; padding-left: 20px; }
        .modal-body li { padding: 4px 0; font-size: 13px; color: #374151; }
        .modal-empty { color: #6b7280; font-size: 13px; padding: 10px 0; }
        .modal-count { font-size: 12px; color: #6b7280; margin-bottom: 8px; }

        /* ---- Expected business ---- */

        .eb-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .eb-tile {
            border: 1px solid #dbe3ec;
            border-left: 5px solid #1f4e78;
            border-radius: 7px;
            padding: 10px 14px;
            background: #f8fafc;
        }

        .eb-tile .label { display: block; font-size: 12px; color: #6b7280; margin-bottom: 4px; }
        .eb-tile .value { display: block; font-size: 20px; font-weight: 700; color: #111827; }
        .eb-tile .sub { display: block; font-size: 11px; color: #6b7280; margin-top: 2px; }

        .eb-table th { white-space: nowrap; }

        .plan-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 2px;
            margin-right: 6px;
            vertical-align: middle;
            border: 1px solid rgba(255,255,255,0.7);
        }

        .amount-cell .big { font-size: 15px; font-weight: 700; display: block; color: #1f2937; }
        .amount-cell .small { font-size: 11px; color: #6b7280; }
        .amount-cell.zero .big { color: #b6bec9; font-weight: 400; }
        .amount-cell.total-col { background: #eef6ff; }
        .amount-cell.total-col .big { color: #1457b8; }

        .mix-col { min-width: 160px; }
        .mix-bar { display: flex; height: 14px; border-radius: 3px; overflow: hidden; background: #eef1f5; }
        .mix-bar span { display: block; height: 100%; }

        .data-source { margin-top: 10px; font-size: 12px; color: #6b7280; line-height: 1.5; }

        .warn-note {
            margin-top: 10px;
            padding: 10px 12px;
            background: #fffbeb;
            border: 1px solid #fde68a;
            border-radius: 6px;
            color: #92400e;
            font-size: 13px;
        }

        .warn-note code { background: #fef3c7; padding: 1px 4px; border-radius: 3px; }

        /* ---- Stage funnel ---- */

        .funnel { display: flex; flex-direction: column; gap: 6px; }

        .funnel-row {
            display: grid;
            grid-template-columns: 230px 1fr 140px;
            align-items: center;
            gap: 12px;
            padding: 4px 6px;
            border-radius: 6px;
        }

        .funnel-row:hover { background: #f3f4f6; }
        .funnel-stage { font-size: 13px; font-weight: 600; color: #1f2937; }
        .funnel-track { display: flex; justify-content: center; }
        .funnel-bar { height: 26px; border-radius: 4px; min-width: 6px; }
        .funnel-value { text-align: right; }
        .funnel-value .big { display: block; font-size: 14px; font-weight: 700; color: #1f2937; }
        .funnel-value .small { font-size: 11px; color: #6b7280; }

        .funnel-total {
            margin-top: 8px;
            padding-top: 10px;
            border-top: 1px solid #e5e7eb;
            font-size: 13px;
            color: #374151;
            text-align: right;
        }

        .section-note { font-size: 12px; color: #6b7280; margin: -8px 0 12px 0; }

        @media (max-width: 900px) {
            .card-row { grid-template-columns: repeat(2, 1fr); }
            .funnel-row { grid-template-columns: 140px 1fr 100px; }
            .mix-col { display: none; }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div>
            <h1>Management Dashboard</h1>
            <p>Owner-filterable target, activity, and pipeline overview</p>
        </div>
        <div class="header-controls">
            <div class="filter-group">
                <label for="ownerFilter">Account owner</label>
                <select id="ownerFilter" onchange="renderAll()">
                    <option value="All Owners">All Owners</option>
                </select>
            </div>
            <div class="filter-group hidden" id="gistFilterGroup">
                <label for="gistOwnerFilter">Gist account owner</label>
                <select id="gistOwnerFilter" onchange="renderAll()">
                    <option value="__all_gist__">All Gist Account Owners</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="quarterFilter">Quarter</label>
                <select id="quarterFilter" onchange="renderAll()"></select>
            </div>
            <button id="refreshButton" onclick="loadReport()">Refresh</button>
            <div class="last-updated" id="lastUpdated">Last Updated: -</div>
        </div>
    </div>

    <div id="content">
        <div class="loading">Loading dashboard...</div>
    </div>

    <div class="section">
        <h2 id="aorTitle">Account Owner Summary (FY 2026-27)</h2>
        <div id="accountOwnerSummarySection">
            <div class="loading">Loading account owner summary...</div>
        </div>
    </div>

</div>

<div class="modal-overlay" id="drilldownModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="drilldownTitle">Records</h3>
            <button class="modal-close" onclick="closeDrilldown()">&times;</button>
        </div>
        <div class="modal-body" id="drilldownBody">Loading...</div>
    </div>
</div>

<script>

/* =========================================================
   CONFIGURATION
   ========================================================= */

/* Financial year: 1 April FY_START_YEAR to 31 March FY_START_YEAR + 1 */
var FY_START_YEAR = 2026;

/* Deal Year value the dashboard is scoped to (your Year2 field) */
var FY_FILTER = FY_START_YEAR + "-" + (FY_START_YEAR + 1);

/*
 * true  = a deal counts only if its Closing Date is between 1 Apr 2026 and 31 Mar 2027
 * false = Closing Date outside that range is still counted under "All Quarters"
 */
var REQUIRE_CLOSING_DATE_IN_FY = true;   // tables, funnel and summary only

/*
 * The four amount cards (Achieved, Payment Received, Payment Pending,
 * Current Pipeline) use Stage + Deal Year + Expected Business only.
 * Closing Date is used for them only when a specific quarter is chosen.
 */

/*
 * Field API names. Leave "" to auto-detect. If the grey note under the
 * Quarter x Plan table shows the wrong field, type the correct API name
 * here (Setup > Developer Hub > APIs & SDKs > API Names).
 */
var DEAL_FIELDS = {
    amount: "",              // Deals: the "Expected Business" field (auto)
    plan: "",                // Deals: Deal_Category, else a field labelled "Plan"
    year: "",                // Deals: Year2, else a field labelled "Year"
    product: "",             // Deals: a field labelled "Product" (auto)
    closingDate: "Closing_Date"
};

/*
 * Current Pipeline = sum of Expected Business where Product isn't one of these.
 * Deals with no Product filled in are included (same as a Zoho "isn't" filter).
 */
var PIPELINE_EXCLUDED_PRODUCTS = ["Knimbus Default"];
var PIPELINE_OPEN_STAGES_ONLY = true;      // also leave out won and Closed Lost deals
var PIPELINE_REQUIRE_SAME_OWNER = true;    // card only: deal owner must also own the account

var ACCOUNT_GIST_FIELD = "";   // Accounts: field labelled "Gist Account Owner" (auto)

/* "rupees" = stored like 1112000, "lakh" = stored like 11.12, "auto" = decide from the data */
var AMOUNT_UNIT = "auto";

/* Closed Lost deals are not counted as expected business (they still show in the stage funnel) */
var EXCLUDE_LOST_FROM_EXPECTED = true;

var ALLOWED_ACCOUNT_OWNERS = ["Anurag Mishra", "Tejal Pandya", "GIST HQ"];
var GIST_HQ_OWNER_NAME = "GIST HQ";

var PAYMENT_RECEIVED_STAGES = ["Payment Received", "Short Payment", "Part Payment Received"];
var PAYMENT_PENDING_STAGES = ["Order Booked", "Email Confirmation", "PI Sent - Order Received"];
var CLOSED_WON_STAGES = PAYMENT_RECEIVED_STAGES.concat(PAYMENT_PENDING_STAGES, ["Closed Won"]);
var CLOSED_LOST_STAGE = "Closed Lost";
var EXCLUDED_DEAL_NAME_WORDS = ["test", "trigya"];

var STAGE_ORDER = [
    "Met and Interested",
    "Demonstrated and Queries Handled",
    "Proposal Sent",
    "Negotiation/Review",
    "PI Sent - Order Received",
    "Email Confirmation",
    "Order Booked",
    "Part Payment Received",
    "Short Payment",
    "Payment Received",
    "Closed Won",
    "Closed Lost"
];

var PLAN_COLORS = { "Plan A": "#d64550", "Plan B": "#f0b429", "Plan C": "#e8919c", "No Plan": "#9ca3af" };
var EXTRA_PLAN_COLORS = ["#0ea5e9", "#8b5cf6", "#10b981", "#f97316", "#6b7280"];


/* =========================================================
   CONSTANTS / STATE
   ========================================================= */

var FY_SHORT_LABEL = "FY " + String(FY_START_YEAR).slice(2) + "-" + String(FY_START_YEAR + 1).slice(2);
var FY_LONG_LABEL = "FY " + FY_START_YEAR + "-" + String(FY_START_YEAR + 1).slice(2);
var FY_START = new Date(FY_START_YEAR, 3, 1, 0, 0, 0, 0);
var FY_END = new Date(FY_START_YEAR + 1, 2, 31, 23, 59, 59, 999);

var QUARTER_INFO = {
    Q1: { range: "1 Apr - 30 Jun " + FY_START_YEAR, short: "Apr-Jun " + FY_START_YEAR },
    Q2: { range: "1 Jul - 30 Sep " + FY_START_YEAR, short: "Jul-Sep " + FY_START_YEAR },
    Q3: { range: "1 Oct - 31 Dec " + FY_START_YEAR, short: "Oct-Dec " + FY_START_YEAR },
    Q4: { range: "1 Jan - 31 Mar " + (FY_START_YEAR + 1), short: "Jan-Mar " + (FY_START_YEAR + 1) }
};

var ALL_QUARTERS = "All Quarters";
var GIST_ACCOUNT_OWNER_DEFAULT = "__all_gist__";
var GIST_NOT_ASSIGNED = "(Not assigned)";
var CARD_CATEGORIES = ["achieved", "payment_received", "payment_pending", "current_pipeline"];

var lastReportData = null;
var lastAccountOwnerSummaryData = null;
var renderToken = 0;

var liveDataPromise = null;
var liveResolved = null;
var fieldInfo = null;
var amountUnitInUse = "rupees";
var callsCache = {};
var aorLive = null;

populateQuarterFilter();

ZOHO.embeddedApp.on("PageLoad", function() { loadReport(); loadAccountOwnerSummary(); });
ZOHO.embeddedApp.init();


/* =========================================================
   FILTERS
   ========================================================= */

function populateQuarterFilter() {
    var select = document.getElementById("quarterFilter");
    var html = '<option value="' + ALL_QUARTERS + '">All Quarters (1 Apr ' + FY_START_YEAR +
        ' - 31 Mar ' + (FY_START_YEAR + 1) + ')</option>';
    ["Q1", "Q2", "Q3", "Q4"].forEach(function(q) {
        html += '<option value="' + q + '">' + q + ' (' + QUARTER_INFO[q].range + ')</option>';
    });
    select.innerHTML = html;
}


function populateOwnerFilter() {

    var select = document.getElementById("ownerFilter");
    var currentValue = select.value || "All Owners";

    select.innerHTML = '<option value="All Owners">All Owners</option>';

    ALLOWED_ACCOUNT_OWNERS.forEach(function(name) {
        var option = document.createElement("option");
        option.value = name;
        option.innerText = name;
        select.appendChild(option);
    });

    select.value = currentValue;
    if (select.value !== currentValue) select.value = "All Owners";
}


function isGistHqName(name) {
    return String(name || "").trim().toLowerCase() === GIST_HQ_OWNER_NAME.toLowerCase();
}


function populateGistOwnerFilter() {

    var group = document.getElementById("gistFilterGroup");
    var select = document.getElementById("gistOwnerFilter");
    var selectedOwner = document.getElementById("ownerFilter").value || "All Owners";
    var showGist = isGistHqName(selectedOwner);
    var previous = select.value;

    group.classList.toggle("hidden", !showGist);

    var values = liveResolved ? liveResolved.gistValues : [];
    var html = '<option value="' + GIST_ACCOUNT_OWNER_DEFAULT + '">All Gist Account Owners</option>';

    if (!liveResolved) {
        html += '<option disabled>Loading names...</option>';
    } else if (values.length === 0) {
        html += '<option disabled>No Gist Account Owner values found</option>';
    }

    values.forEach(function(name) {
        html += '<option value="' + escapeHtml(name) + '">' + escapeHtml(name) + '</option>';
    });

    select.innerHTML = html;
    select.value = (showGist && values.indexOf(previous) !== -1) ? previous : GIST_ACCOUNT_OWNER_DEFAULT;
}


function currentGistSelection() {
    var selectedOwner = document.getElementById("ownerFilter").value || "All Owners";
    if (!isGistHqName(selectedOwner)) return GIST_ACCOUNT_OWNER_DEFAULT;
    return document.getElementById("gistOwnerFilter").value || GIST_ACCOUNT_OWNER_DEFAULT;
}


function currentQuarterSelection() {
    return document.getElementById("quarterFilter").value || ALL_QUARTERS;
}


function periodLabel(selectedQuarter) {
    if (!selectedQuarter || selectedQuarter === ALL_QUARTERS) return FY_LONG_LABEL;
    return FY_LONG_LABEL + ", " + selectedQuarter + " (" + QUARTER_INFO[selectedQuarter].range + ")";
}


/* =========================================================
   LOAD CACHED REPORT (writer output)
   ========================================================= */

function loadReport() {

    var button = document.getElementById("refreshButton");
    var content = document.getElementById("content");

    button.disabled = true;
    button.innerText = "Loading...";
    content.innerHTML = '<div class="loading">Loading dashboard from Zoho CRM...</div>';

    liveDataPromise = null;
    liveResolved = null;
    callsCache = {};
    loadLiveData().catch(function() {});

    ZOHO.CRM.FUNCTIONS.execute("Mgmt_dashboard_reader", { "arguments": JSON.stringify({}) })

        .then(function(response) {

            var data = findPayload(response);

            if (!data) {
                content.innerHTML = '<div class="error">Response received, but no usable data was found.</div>';
                return;
            }

            if (data.status === "error") {
                content.innerHTML = '<div class="error">' + escapeHtml(data.message || "Unknown error.") + '</div>';
                return;
            }

            lastReportData = data;
            populateOwnerFilter();
            renderAll();

            document.getElementById("lastUpdated").innerText = "Last Updated: " + (data.generated_time || "-");
        })

        .catch(function(error) {
            content.innerHTML = '<div class="error">Unable to load dashboard.<br><pre>' +
                escapeHtml(JSON.stringify(error, null, 2)) + '</pre></div>';
        })

        .finally(function() {
            button.disabled = false;
            button.innerText = "Refresh";
        });
}


function findPayload(response, depth) {

    depth = depth || 0;
    if (depth > 8 || response === null || response === undefined) return null;

    if (typeof response === "string") {
        try { return findPayload(JSON.parse(response), depth + 1); }
        catch (e) { return null; }
    }

    if (typeof response === "object") {

        if (response.per_owner || Array.isArray(response.owners) || response.status === "error") {
            return response;
        }

        var priorityKeys = ["output", "details", "result", "response", "data"];

        for (var i = 0; i < priorityKeys.length; i++) {
            if (response[priorityKeys[i]] !== undefined) {
                var found = findPayload(response[priorityKeys[i]], depth + 1);
                if (found) return found;
            }
        }

        for (var key in response) {
            if (priorityKeys.indexOf(key) !== -1) continue;
            var found2 = findPayload(response[key], depth + 1);
            if (found2) return found2;
        }
    }

    return null;
}


/* =========================================================
   LIVE DEALS + ACCOUNTS
   Loaded once and reused by every section and drilldown until
   Refresh is clicked.
   ========================================================= */

function loadLiveData() {

    if (!liveDataPromise) {

        liveDataPromise = Promise.all([
            getFieldsSafe("Deals"),
            getFieldsSafe("Accounts"),
            zohoSearchAll("Deals", null),
            zohoSearchAll("Accounts", null)
        ]).then(function(results) {
            liveResolved = buildLiveData(results[0], results[1], results[2] || [], results[3] || []);
            return liveResolved;
        });

        liveDataPromise.catch(function() { liveDataPromise = null; });
    }

    return liveDataPromise;
}


function getFieldsSafe(entity) {
    try {
        if (!ZOHO.CRM.META || !ZOHO.CRM.META.getFields) return Promise.resolve([]);
        return ZOHO.CRM.META.getFields({ Entity: entity })
            .then(function(response) {
                var fields = response && (response.fields || response.data);
                return Array.isArray(fields) ? fields : [];
            })
            .catch(function() { return []; });
    } catch (e) {
        return Promise.resolve([]);
    }
}


function fieldValueList(value) {
    if (value === undefined || value === null || value === "") return [];
    if (Array.isArray(value)) {
        var out = [];
        value.forEach(function(v) { out = out.concat(fieldValueList(v)); });
        return out;
    }
    if (typeof value === "object") {
        var text = value.name || value.display_value || value.value || value.full_name || "";
        return String(text).trim() ? [String(text).trim()] : [];
    }
    var s = String(value).trim();
    return s ? [s] : [];
}


function fieldValueText(value) {
    return fieldValueList(value).join(", ");
}


function parseNumber(value) {
    if (value && typeof value === "object") value = value.value !== undefined ? value.value : value.amount;
    if (value === undefined || value === null || value === "" || typeof value === "boolean") return 0;
    var parsed = Number(String(value).replace(/,/g, "").replace(/[₹$\s]|Rs\.?|INR/gi, ""));
    return isNaN(parsed) ? 0 : parsed;
}


function fieldOptions(meta, records) {
    var options = [];
    var seen = {};

    (meta || []).forEach(function(f) {
        if (!f || !f.api_name || seen[f.api_name]) return;
        seen[f.api_name] = true;
        options.push({ api: f.api_name, label: f.field_label || f.api_name, type: String(f.data_type || "").toLowerCase() });
    });

    (records || []).slice(0, 300).forEach(function(r) {
        Object.keys(r || {}).forEach(function(k) {
            if (seen[k]) return;
            seen[k] = true;
            options.push({ api: k, label: k, type: "" });
        });
    });

    return options;
}


function optionText(o) {
    return (o.label + " " + o.api.replace(/_/g, " ")).toLowerCase();
}


function describeField(api, options, found) {
    for (var i = 0; i < options.length; i++) {
        if (options[i].api === api) return { api: api, label: options[i].label, found: !!found };
    }
    return { api: api, label: api, found: !!found };
}


/* Walks tiers in order; within a tier picks the field with the most filled-in values */
function pickByTiers(options, tiers, scoreFn) {
    for (var t = 0; t < tiers.length; t++) {
        var best = null;
        var bestScore = 0;
        options.forEach(function(o) {
            if (!tiers[t](o)) return;
            var score = scoreFn(o.api);
            if (score > bestScore) { best = o; bestScore = score; }
        });
        if (best) return { api: best.api, label: best.label, found: true };
    }
    return null;
}


function countNonEmpty(records, api) {
    var n = 0;
    records.forEach(function(r) { if (fieldValueList(r[api]).length) n++; });
    return n;
}


function countNonZero(records, api) {
    var n = 0;
    records.forEach(function(r) { if (parseNumber(r[api]) !== 0) n++; });
    return n;
}


function chooseYearField(options, deals) {
    if (DEAL_FIELDS.year) return describeField(DEAL_FIELDS.year, options, true);
    return pickByTiers(options, [
        function(o) { return o.api === "Year2"; },
        function(o) { return /\bdeal year\b|\bfiscal year\b|\bfinancial year\b|\bfy\b/.test(optionText(o)); },
        function(o) { return /\byear\b/.test(optionText(o)) && o.type !== "date" && o.type !== "datetime"; }
    ], function(api) { return countNonEmpty(deals, api); }) || describeField("Year2", options, false);
}


var NOT_AMOUNT_WORDS = /probab|percent|discount|tax|qty|quantity|days|score|phone|mobile|pin ?code|zip|year|count|rating|number of|no of|exchange rate|\bid\b/;

function isAmountLike(o) {
    var numericTypes = ["currency", "double", "integer", "bigint", "formula", "decimal", "long", ""];
    return numericTypes.indexOf(o.type) !== -1 && !NOT_AMOUNT_WORDS.test(optionText(o));
}


function chooseAmountField(options, deals) {
    if (DEAL_FIELDS.amount) return describeField(DEAL_FIELDS.amount, options, true);
    return pickByTiers(options, [
        function(o) { return /expected ?business/.test(optionText(o)); },
        function(o) { return o.api === "Amount"; },
        function(o) { return isAmountLike(o) && /business|lakh/.test(optionText(o)); },
        function(o) { return isAmountLike(o) && /expected|amount|value|revenue|total|price|deal size/.test(optionText(o)); }
    ], function(api) { return countNonZero(deals, api); }) || expectedBusinessFallback(options);
}


function expectedBusinessFallback(options) {
    for (var i = 0; i < options.length; i++) {
        if (/expected ?business/.test(optionText(options[i]))) {
            return { api: options[i].api, label: options[i].label, found: true };
        }
    }
    return describeField("Amount", options, false);
}


function chooseProductField(options, deals) {
    if (DEAL_FIELDS.product) return describeField(DEAL_FIELDS.product, options, true);
    return pickByTiers(options, [
        function(o) { return o.api === "Product" || o.api === "Product_Name"; },
        function(o) { return /\bproducts?\b/.test(optionText(o)) && !/amount|price|qty|quantity|code|id\b/.test(optionText(o)); }
    ], function(api) { return countNonEmpty(deals, api); }) || describeField("Product", options, false);
}


function choosePlanField(options, deals) {
    if (DEAL_FIELDS.plan) return describeField(DEAL_FIELDS.plan, options, true);
    return pickByTiers(options, [
        function(o) { return o.api === "Deal_Category"; },
        function(o) { return /\bplan\b/.test(optionText(o)); },
        function(o) { return /categor/.test(optionText(o)); }
    ], function(api) { return countNonEmpty(deals, api); }) || describeField("Deal_Category", options, false);
}


function chooseGistField(options, accounts) {
    if (ACCOUNT_GIST_FIELD) return describeField(ACCOUNT_GIST_FIELD, options, true);
    return pickByTiers(options, [
        function(o) { return /gist.*account.*owner/.test(optionText(o)); },
        function(o) { return /gist.*owner/.test(optionText(o)); },
        function(o) { return /gist/.test(optionText(o)) && !/bucket/.test(optionText(o)); }
    ], function(api) { return countNonEmpty(accounts, api); }) || describeField("GIST_Account_Owner", options, false);
}


function buildLiveData(dealMeta, accountMeta, deals, accounts) {

    var dealOptions = fieldOptions(dealMeta, deals);
    var accountOptions = fieldOptions(accountMeta, accounts);

    fieldInfo = { closingDate: DEAL_FIELDS.closingDate || "Closing_Date" };
    fieldInfo.year = chooseYearField(dealOptions, deals);

    var fyDeals = deals.filter(function(d) { return dealFiscalYear(d) === FY_FILTER; });
    var scope = fyDeals.length ? fyDeals : deals;

    fieldInfo.amount = chooseAmountField(dealOptions, scope);
    fieldInfo.plan = choosePlanField(dealOptions, scope);
    fieldInfo.product = chooseProductField(dealOptions, scope);

    var gistHqAccounts = accounts.filter(function(a) { return isGistHqName(ddLookupName(a.Owner, "")); });
    fieldInfo.gist = chooseGistField(accountOptions, gistHqAccounts.length ? gistHqAccounts : accounts);

    amountUnitInUse = decideAmountUnit(scope);

    var accountsById = {};
    var ownerIdByName = {};
    var gistSet = {};
    var gistHasEmpty = false;

    accounts.forEach(function(a) {

        if (!a.id) return;

        var ownerName = ddLookupName(a.Owner, "Unassigned");
        var ownerId = ddLookupId(a.Owner);
        var gistNames = fieldValueList(a[fieldInfo.gist.api]);

        accountsById[String(a.id)] = {
            id: String(a.id),
            name: a.Account_Name || "(Unnamed Account)",
            ownerId: ownerId,
            ownerName: ownerName,
            bucket: fieldValueText(a.Bucket_Type) || "No Bucket",
            gistNames: gistNames
        };

        if (ownerId) ownerIdByName[ownerName.trim().toLowerCase()] = ownerId;

        if (isGistHqName(ownerName)) {
            if (gistNames.length === 0) gistHasEmpty = true;
            gistNames.forEach(function(n) { gistSet[n] = true; });
        }
    });

    var gistValues = Object.keys(gistSet).sort(function(a, b) { return a.toLowerCase().localeCompare(b.toLowerCase()); });
    if (gistHasEmpty) gistValues.push(GIST_NOT_ASSIGNED);

    var outsideWindow = fyDeals.filter(function(d) {
        return !isInFyWindow(ddParseDate(d[fieldInfo.closingDate]));
    }).length;

    return {
        deals: deals,
        accountsById: accountsById,
        ownerIdByName: ownerIdByName,
        gistValues: gistValues,
        gistHqAccountCount: gistHqAccounts.length,
        fyDealCount: fyDeals.length,
        outsideWindow: outsideWindow
    };
}


function rawDealAmount(deal) {
    return parseNumber(deal ? deal[fieldInfo.amount.api] : null);
}


function decideAmountUnit(deals) {

    if (AMOUNT_UNIT === "lakh" || AMOUNT_UNIT === "rupees") return AMOUNT_UNIT;
    if (/lakh|\blac\b/i.test(fieldInfo.amount.label + " " + fieldInfo.amount.api)) return "lakh";

    var values = [];
    deals.forEach(function(deal) {
        var v = Math.abs(rawDealAmount(deal));
        if (v) values.push(v);
    });

    if (values.length === 0) return "rupees";

    values.sort(function(a, b) { return a - b; });
    return values[Math.floor(values.length / 2)] < 1000 ? "lakh" : "rupees";
}


function dealAmountLakh(deal) {
    var raw = rawDealAmount(deal);
    return amountUnitInUse === "lakh" ? raw : raw / 100000;
}


function dealPlanName(deal) {
    return fieldValueText(deal ? deal[fieldInfo.plan.api] : null) || "No Plan";
}


function dealFiscalYear(deal) {

    var value = fieldValueText(deal ? deal[fieldInfo.year.api] : null);

    if (value) {
        value = value.replace(/^FY\s*/i, "").replace(/\s+/g, "");
        var full = value.match(/^(\d{4})[-\/](\d{4})$/);
        if (full) return full[1] + "-" + full[2];
        var shortEnd = value.match(/^(\d{4})[-\/](\d{2})$/);
        if (shortEnd) return shortEnd[1] + "-" + (Number(shortEnd[1]) + 1);
        var bothShort = value.match(/^(\d{2})[-\/](\d{2})$/);
        if (bothShort) return "20" + bothShort[1] + "-20" + bothShort[2];
        return value;
    }

    var date = ddParseDate(deal && deal[fieldInfo.closingDate]);
    if (!date) return "";
    var year = date.getFullYear();
    return (date.getMonth() >= 3) ? (year + "-" + (year + 1)) : ((year - 1) + "-" + year);
}


function isInFyWindow(date) {
    return !!date && date >= FY_START && date <= FY_END;
}


function isClosedWonStage(stage) {
    return CLOSED_WON_STAGES.indexOf(String(stage || "").trim()) !== -1;
}


function isCurrentPipelineStage(stage) {
    var normalized = String(stage || "").trim();
    return !isClosedWonStage(normalized) && normalized !== CLOSED_LOST_STAGE;
}


function isExcludedTestDeal(deal) {
    var name = String((deal && deal.Deal_Name) || "").toLowerCase();
    return EXCLUDED_DEAL_NAME_WORDS.some(function(word) { return name.indexOf(word) !== -1; });
}


function accountMatchesGist(account, gistSelection) {
    if (!gistSelection || gistSelection === GIST_ACCOUNT_OWNER_DEFAULT) return true;
    if (!account) return false;
    if (gistSelection === GIST_NOT_ASSIGNED) return account.gistNames.length === 0;
    return account.gistNames.indexOf(gistSelection) !== -1;
}


/*
 * Shared per-deal filter (FY, closing-date quarter, Gist account owner).
 * Cards, charts, summary and every drilldown use it, so numbers and
 * popup lists always agree. Returns null when the deal is filtered out.
 */
function dealContext(deal, live, selectedQuarter, gistSelection, cardMode) {

    if (dealFiscalYear(deal) !== FY_FILTER) return null;

    var accId = ddLookupId(deal.Account_Name);
    if (!accId) return null;

    var closingDate = ddParseDate(deal[fieldInfo.closingDate]);
    var inWindow = isInFyWindow(closingDate);
    if (!cardMode && REQUIRE_CLOSING_DATE_IN_FY && !inWindow) return null;

    var quarter = inWindow ? monthQuarter(closingDate) : null;
    var allQuarters = !selectedQuarter || selectedQuarter === ALL_QUARTERS;
    if (!allQuarters && quarter !== selectedQuarter) return null;

    var account = live.accountsById[accId] || null;
    if (!accountMatchesGist(account, gistSelection)) return null;

    return {
        accId: accId,
        account: account,
        accName: account ? account.name : ddLookupName(deal.Account_Name, "(Unnamed Account)"),
        quarter: quarter,
        inWindow: inWindow,
        stage: String(deal.Stage || "").trim() || "Unknown",
        amount: dealAmountLakh(deal),
        plan: dealPlanName(deal),
        products: fieldValueList(deal[fieldInfo.product.api]),
        dealOwnerId: ddLookupId(deal.Owner),
        excluded: isExcludedTestDeal(deal)
    };
}


/* Current Pipeline: Product isn't Knimbus Default (+ open stage if configured) */
function isPipelineDeal(ctx) {
    var excluded = PIPELINE_EXCLUDED_PRODUCTS.map(function(p) { return p.trim().toLowerCase(); });
    var hasExcludedProduct = ctx.products.some(function(p) { return excluded.indexOf(p.trim().toLowerCase()) !== -1; });
    if (hasExcludedProduct) return false;
    if (PIPELINE_OPEN_STAGES_ONLY && !isCurrentPipelineStage(ctx.stage)) return false;
    return true;
}


/* Cards: scoped to the DEAL owner (same rule as the writer) */
function matchesCardCategory(ctx, category, ownerId) {

    if (ownerId && ctx.dealOwnerId !== ownerId) return false;

    if (category === "achieved") return isClosedWonStage(ctx.stage) && !ctx.excluded;
    if (category === "payment_received") return PAYMENT_RECEIVED_STAGES.indexOf(ctx.stage) !== -1 && !ctx.excluded;
    if (category === "payment_pending") return PAYMENT_PENDING_STAGES.indexOf(ctx.stage) !== -1;
    if (category === "current_pipeline") {
        if (!isPipelineDeal(ctx)) return false;
        return !PIPELINE_REQUIRE_SAME_OWNER || (!!ctx.account && ctx.account.ownerId === ctx.dealOwnerId);
    }
    return false;
}


/* Charts and summary: scoped to the linked ACCOUNT owner */
function matchesAccountOwner(ctx, ownerId) {
    return !ownerId || (!!ctx.account && ctx.account.ownerId === ownerId);
}


function countsAsExpected(ctx) {
    return !(EXCLUDE_LOST_FROM_EXPECTED && ctx.stage === CLOSED_LOST_STAGE);
}


function addAmount(target, key, amount) {
    if (!target[key]) target[key] = { amount_lakh: 0, count: 0 };
    target[key].amount_lakh += amount;
    target[key].count += 1;
}


function computeDealMetrics(live, ownerId, gistSelection, selectedQuarter) {

    var quarters = selectedQuarter && selectedQuarter !== ALL_QUARTERS ? [selectedQuarter] : ["Q1", "Q2", "Q3", "Q4"];

    var m = {
        quarters: quarters,
        plans: [],
        matrix: {},
        pipelineByQuarter: {},
        planTotals: {},
        stageTotals: {},
        cards: { achieved: 0, payment_received: 0, payment_pending: 0, current_pipeline: 0 },
        pipelineAccounts: {},
        pipelineTableAccounts: {},
        periodDeals: 0,
        dealsWithAmount: 0,
        dealsWithPlan: 0
    };

    quarters.forEach(function(q) {
        m.matrix[q] = {};
        m.pipelineByQuarter[q] = { amount_lakh: 0, count: 0, accounts: {} };
    });

    live.deals.forEach(function(deal) {

        // Cards: Stage + Deal Year + Expected Business (no closing-date window)
        var ctx = dealContext(deal, live, selectedQuarter, gistSelection, true);
        if (!ctx) return;

        CARD_CATEGORIES.forEach(function(category) {
            if (!matchesCardCategory(ctx, category, ownerId)) return;
            m.cards[category] += ctx.amount;
            if (category === "current_pipeline") m.pipelineAccounts[ctx.accId] = true;
        });

        // Tables and funnel: also need the Closing Date inside the FY
        if (REQUIRE_CLOSING_DATE_IN_FY && !ctx.inWindow) return;

        m.periodDeals++;
        if (ctx.amount) m.dealsWithAmount++;
        if (ctx.plan !== "No Plan") m.dealsWithPlan++;

        if (!matchesAccountOwner(ctx, ownerId)) return;

        addAmount(m.stageTotals, ctx.stage, ctx.amount);

        if (!ctx.quarter) return;

        if (countsAsExpected(ctx)) {
            addAmount(m.matrix[ctx.quarter], ctx.plan, ctx.amount);
            addAmount(m.planTotals, ctx.plan, ctx.amount);
        }

        if (isPipelineDeal(ctx)) {
            m.pipelineByQuarter[ctx.quarter].amount_lakh += ctx.amount;
            m.pipelineByQuarter[ctx.quarter].count += 1;
            m.pipelineByQuarter[ctx.quarter].accounts[ctx.accId] = true;
            m.pipelineTableAccounts[ctx.accId] = true;
        }
    });

    var known = ["Plan A", "Plan B", "Plan C"];
    var found = Object.keys(m.planTotals);

    m.plans = known.filter(function(p) { return found.indexOf(p) !== -1; });
    found.sort().forEach(function(p) {
        if (m.plans.indexOf(p) === -1 && p !== "No Plan") m.plans.push(p);
    });
    if (found.indexOf("No Plan") !== -1) m.plans.push("No Plan");

    return m;
}


function computeWonLostByOwner(live, gistSelection, selectedQuarter) {

    var result = {};

    live.deals.forEach(function(deal) {

        var ctx = dealContext(deal, live, selectedQuarter, gistSelection);
        if (!ctx || !ctx.account) return;

        var key = ctx.account.ownerName.trim().toLowerCase();
        if (!result[key]) result[key] = { won: {}, lost: {} };

        if (isClosedWonStage(ctx.stage) && !ctx.excluded) result[key].won[ctx.accId] = true;
        else if (ctx.stage === CLOSED_LOST_STAGE) result[key].lost[ctx.accId] = true;
    });

    return result;
}


/* =========================================================
   ACCOUNT ACTIVITY (live, used when a Gist account owner is chosen)
   ========================================================= */

function filterAccounts(live, ownerId, gistSelection) {
    var list = [];
    Object.keys(live.accountsById).forEach(function(id) {
        var a = live.accountsById[id];
        if (ownerId && a.ownerId !== ownerId) return;
        if (!accountMatchesGist(a, gistSelection)) return;
        list.push(a);
    });
    return list;
}


function getAllCalls() {
    if (!callsCache.__all__) callsCache.__all__ = zohoSearchAll("Calls", null);
    return callsCache.__all__;
}


function getOwnerCalls(ownerId) {

    if (!ownerId) return getAllCalls();

    if (!callsCache[ownerId]) {
        callsCache[ownerId] = zohoSearchAll("Calls", "(Owner:equals:" + ownerId + ")").then(function(calls) {
            // Zoho search stops at 2,000 results; fall back to the full list if we hit that
            if (calls.length >= 2000) {
                return getAllCalls().then(function(all) {
                    return all.filter(function(c) { return ddLookupId(c.Owner) === ownerId; });
                });
            }
            return calls;
        });
    }

    return callsCache[ownerId];
}


function latestOwnerCalls(accounts, calls) {

    var byId = {};
    accounts.forEach(function(a) { byId[a.id] = a; });

    var latest = {};

    calls.forEach(function(call) {
        var whatId = ddLookupId(call.What_Id);
        var account = byId[whatId];
        if (!account) return;
        if (ddLookupId(call.Owner) !== account.ownerId) return;
        var date = ddParseDate(call.Call_Start_Time);
        if (!date) return;
        if (!latest[whatId] || date > latest[whatId]) latest[whatId] = date;
    });

    return latest;
}


function agingOf(date) {
    var days = Math.floor((new Date() - date) / 86400000);
    if (days <= 30) return "last_30";
    if (days <= 60) return "days_31_60";
    return "days_60_plus";
}


function computeAccountStats(accounts, calls) {

    var latest = latestOwnerCalls(accounts, calls);
    var stats = { total: 0, touched: 0, untouched: 0, last_30: 0, days_31_60: 0, days_60_plus: 0, bucket_summary: {} };

    accounts.forEach(function(a) {

        stats.total++;

        if (!stats.bucket_summary[a.bucket]) {
            stats.bucket_summary[a.bucket] = { Total: 0, last_30: 0, days_31_60: 0, days_60_plus: 0, non_touched: 0 };
        }

        var bs = stats.bucket_summary[a.bucket];
        bs.Total++;

        var lastCall = latest[a.id];

        if (!lastCall) {
            stats.untouched++;
            bs.non_touched++;
        } else {
            var age = agingOf(lastCall);
            stats.touched++;
            stats[age]++;
            bs[age]++;
        }
    });

    return stats;
}


/* =========================================================
   RENDER
   ========================================================= */

function resolveOwnerId(ownerName, live) {
    if (!ownerName || ownerName === "All Owners") return null;
    var cached = lastReportData && lastReportData.per_owner && lastReportData.per_owner[ownerName];
    if (cached && cached.owner_id) return String(cached.owner_id);
    if (live) return live.ownerIdByName[ownerName.trim().toLowerCase()];
    return undefined;
}


function renderAll() {

    if (!lastReportData || !lastReportData.per_owner) return;

    var selectedOwner = document.getElementById("ownerFilter").value || "All Owners";
    var selectedQuarter = currentQuarterSelection();

    populateGistOwnerFilter();

    var gistSelection = currentGistSelection();
    var gistActive = gistSelection !== GIST_ACCOUNT_OWNER_DEFAULT;
    var ownerCache = lastReportData.per_owner[selectedOwner] || {};
    var period = periodLabel(selectedQuarter);

    aorLive = null;
    updateSummaryTitle(selectedQuarter, gistSelection);

    var html = "";

    html += '<div class="card-row">';
    html += cardHtml("Target (full FY)", Number(ownerCache.target_lakhs || 0).toFixed(2) + " L", "target", null);
    html += cardHtml("Achieved (Closed Won)", "Calculating...", "achieved waiting", "achieved");
    html += cardHtml("Payment Received", "Calculating...", "achieved waiting", "payment_received");
    html += cardHtml("Payment Pending / Pipeline", "Calculating...", "pending waiting", "payment_pending");
    html += '</div>';

    html += '<div class="card-row">';
    var cachedTotal = ownerCache.total_accounts || 0;
    html += cardHtml("Total Accounts", gistActive ? "Calculating..." : cachedTotal,
        gistActive ? "waiting" : "", "total_accounts");
    html += cardHtml("Untouched Accounts", gistActive ? "Calculating..." : (ownerCache.untouched || 0),
        gistActive ? "pending waiting" : "pending", "untouched",
        gistActive ? "" : accountShareSub(ownerCache.untouched, cachedTotal));
    html += cardHtml("Touched", gistActive ? "Calculating..." : (ownerCache.touched || 0),
        gistActive ? "achieved waiting" : "achieved", "touched",
        gistActive ? "" : accountShareSub(ownerCache.touched, cachedTotal));
    html += cardHtml("Current Pipeline", "Calculating...", "pending waiting", "current_pipeline");
    html += '</div>';

    html += '<div class="section"><h2>Bucket-wise Activity</h2>';
    html += '<p class="section-note">Account activity is measured from today, so the quarter filter does not change it.</p>';
    html += '<div id="bucketWrap">' +
        (gistActive ? '<div class="loading">Calculating activity for the selected Gist account owner...</div>'
                    : renderBucketTable(ownerCache.bucket_summary)) + '</div>';
    html += '</div>';

    html += '<div class="section"><h2>Expected Business, ' + escapeHtml(period) + ' (Quarter &times; Plan)</h2>';
    html += '<div id="expectedBusinessWrap"><div class="loading">Loading deals...</div></div>';
    html += '</div>';

    html += '<div class="section"><h2>Stage-wise Expected Business, ' + escapeHtml(period) + '</h2>';
    html += '<div id="stageFunnelWrap"><div class="loading">Loading deals...</div></div>';
    html += '</div>';

    document.getElementById("content").innerHTML = html;
    updateAccountOwnerSummaryDisplay();

    var myToken = ++renderToken;

    loadLiveData()

        .then(async function(live) {

            if (myToken !== renderToken) return;

            // Gist names become available once accounts are loaded
            populateGistOwnerFilter();

            var ownerId = resolveOwnerId(selectedOwner, live);

            if (ownerId === undefined) {
                showLiveError("No accounts are owned by " + selectedOwner + ". Check that the name matches Zoho exactly.");
                return;
            }

            var metrics = computeDealMetrics(live, ownerId, gistSelection, selectedQuarter);

            updateAmountCards(metrics.cards, Number(ownerCache.target_lakhs || 0), metrics.pipelineAccounts);
            renderExpectedBusiness(metrics, live);
            renderStageFunnel(metrics);

            aorLive = {
                wonLost: computeWonLostByOwner(live, gistSelection, selectedQuarter),
                gistActive: gistActive,
                gistStats: null
            };
            updateAccountOwnerSummaryDisplay();
            attachDrilldownHandlers(ownerId, selectedOwner);

            if (!gistActive) return;

            var accounts = filterAccounts(live, ownerId, gistSelection);
            var calls = await getOwnerCalls(ownerId);

            if (myToken !== renderToken) return;

            var stats = computeAccountStats(accounts, calls);

            setCardValue("total_accounts", stats.total);
            setCardValue("untouched", stats.untouched);
            setCardValue("touched", stats.touched);
            setCardSub("untouched", accountShareSub(stats.untouched, stats.total));
            setCardSub("touched", accountShareSub(stats.touched, stats.total));

            var bucketWrap = document.getElementById("bucketWrap");
            if (bucketWrap) bucketWrap.innerHTML = renderBucketTable(stats.bucket_summary);

            aorLive.gistStats = stats;
            updateAccountOwnerSummaryDisplay();
            attachDrilldownHandlers(ownerId, selectedOwner);
        })

        .catch(function(err) {
            if (myToken !== renderToken) return;
            console.error("Live data error:", err);
            showLiveError("Could not load Deals and Accounts from Zoho CRM. Click Refresh to try again.");
        });
}


function showLiveError(message) {
    var html = '<div class="error">' + escapeHtml(message) + '</div>';
    ["expectedBusinessWrap", "stageFunnelWrap"].forEach(function(id) {
        var el = document.getElementById(id);
        if (el) el.innerHTML = html;
    });
    CARD_CATEGORIES.concat(["total_accounts", "untouched", "touched"]).forEach(function(cat) {
        var el = document.getElementById("card-" + cat);
        if (el && el.classList.contains("waiting")) setCardValue(cat, "—");
    });
}


function updateSummaryTitle(selectedQuarter, gistSelection) {
    var title = "Account Owner Summary (" + periodLabel(selectedQuarter);
    if (gistSelection && gistSelection !== GIST_ACCOUNT_OWNER_DEFAULT) title += ", Gist account owner: " + gistSelection;
    document.getElementById("aorTitle").innerText = title + ")";
}


function updateAccountOwnerSummaryDisplay() {
    if (!lastAccountOwnerSummaryData) return;
    var selectedOwner = document.getElementById("ownerFilter").value || "All Owners";
    renderAccountOwnerSummary(lastAccountOwnerSummaryData, selectedOwner);
}


function cardHtml(title, value, colorClass, category, sub) {
    var clickableClass = category ? " clickable" : "";
    var dataAttr = category ? ' data-cat="' + category + '"' : "";
    var idAttr = category ? ' id="card-' + category + '"' : "";
    var subId = category ? ' id="card-sub-' + category + '"' : "";
    return '<div class="card"><div class="card-title">' + escapeHtml(title) + '</div>' +
        '<div class="card-value ' + colorClass + clickableClass + '"' + idAttr + dataAttr + '>' + value + '</div>' +
        '<div class="card-sub"' + subId + '>' + (sub || "") + '</div></div>';
}


function setCardSub(category, html) {
    var el = document.getElementById("card-sub-" + category);
    if (el) el.innerHTML = html || "";
}


function percentText(part, whole) {
    part = Number(part || 0);
    whole = Number(whole || 0);
    if (!whole) return null;
    var pct = (part / whole) * 100;
    return (pct >= 10 || pct === 0 ? pct.toFixed(0) : pct.toFixed(1)) + "%";
}


function accountShareSub(count, total) {
    var pct = percentText(count, total);
    return pct ? '<strong>' + pct + '</strong> of ' + Number(total).toLocaleString("en-IN") + ' accounts' : "";
}


function targetShareSub(amountLakh, targetLakh) {
    var pct = percentText(amountLakh, targetLakh);
    return pct ? '<strong>' + pct + '</strong> of ' + formatLakh(targetLakh) + ' target' : "No target set";
}


function setCardValue(category, value) {
    var el = document.getElementById("card-" + category);
    if (!el) return;
    el.innerText = value;
    el.classList.remove("waiting");
}


function accountsLabel(n) {
    return Number(n).toLocaleString("en-IN") + (n === 1 ? " account" : " accounts");
}


function formatLakh(value) {
    var number = Number(value);
    if (isNaN(number)) number = 0;
    return number.toFixed(2) + " L";
}


function updateAmountCards(cards, targetLakh, pipelineAccounts) {
    CARD_CATEGORIES.forEach(function(category) {
        setCardValue(category, formatLakh(cards[category]));
    });
    var pipelineCount = Object.keys(pipelineAccounts || {}).length;
    setCardSub("current_pipeline", '<strong>' + pipelineCount.toLocaleString("en-IN") + '</strong>' +
        (pipelineCount === 1 ? ' account' : ' accounts'));
    setCardSub("achieved", targetShareSub(cards.achieved, targetLakh));
    setCardSub("payment_received", targetShareSub(cards.payment_received, targetLakh));
}


function renderBucketTable(bucketSummary) {

    var buckets = Object.keys(bucketSummary || {}).sort(function(a, b) {
        return a.toLowerCase().localeCompare(b.toLowerCase());
    });

    if (buckets.length === 0) return '<div class="loading">No accounts for the selected filters.</div>';

    var html = '<div class="table-scroll"><table><thead><tr><th style="text-align:left;">Bucket</th>' +
        '<th>Total</th><th>Last 30 Days</th><th>31-60 Days</th><th>60+ Days</th><th>Non-Touched</th></tr></thead><tbody>';

    var grand = { Total: 0, last_30: 0, days_31_60: 0, days_60_plus: 0, non_touched: 0 };

    function bucketCell(count, category) {
        if (count && count > 0) {
            return '<td class="clickable plain" data-cat="' + escapeHtml(category) + '">' + count + '</td>';
        }
        return '<td>' + (count || 0) + '</td>';
    }

    buckets.forEach(function(bucket) {

        var row = bucketSummary[bucket];
        var prefix = "bucket:" + encodeURIComponent(bucket) + ":";

        html += '<tr><td class="row-label">' + escapeHtml(bucket) + '</td>';
        html += bucketCell(row.Total, prefix + "Total");
        html += bucketCell(row.last_30, prefix + "last_30");
        html += bucketCell(row.days_31_60, prefix + "days_31_60");
        html += bucketCell(row.days_60_plus, prefix + "days_60_plus");
        html += bucketCell(row.non_touched, prefix + "non_touched");
        html += '</tr>';

        Object.keys(grand).forEach(function(key) { grand[key] += Number(row[key] || 0); });
    });

    html += '<tr class="grand-total"><td class="row-label">Grand Total</td>' +
        '<td>' + grand.Total + '</td><td>' + grand.last_30 + '</td>' +
        '<td>' + grand.days_31_60 + '</td><td>' + grand.days_60_plus + '</td>' +
        '<td>' + grand.non_touched + '</td></tr>';

    html += '</tbody></table></div>';

    return html;
}


function planColor(plan, index) {
    if (PLAN_COLORS[plan]) return PLAN_COLORS[plan];
    return EXTRA_PLAN_COLORS[index % EXTRA_PLAN_COLORS.length];
}


function lakhCell(bucket, category, extraClass, showAccounts) {

    var amount = Number((bucket && bucket.amount_lakh) || 0);
    var count = Number((bucket && bucket.count) || 0);
    var accountCount = bucket && bucket.accounts ? Object.keys(bucket.accounts).length : 0;
    var classes = "amount-cell" + (extraClass ? " " + extraClass : "") +
        (count && category ? " clickable" : "") + (!count ? " zero" : "");
    var dataAttr = count && category ? ' data-cat="' + escapeHtml(category) + '"' : "";

    return '<td class="' + classes + '"' + dataAttr + '>' +
        '<span class="big">' + amount.toFixed(2) + ' L</span>' +
        '<span class="small">' + (showAccounts
            ? accountCount + (accountCount === 1 ? ' account' : ' accounts')
            : count + (count === 1 ? ' deal' : ' deals')) + '</span></td>';
}


function renderExpectedBusiness(m, live) {

    var wrap = document.getElementById("expectedBusinessWrap");
    if (!wrap) return;

    var notes = dataSourceNotes(m, live);

    if (m.plans.length === 0) {
        wrap.innerHTML = '<div class="loading">No expected business deals for the selected filters.</div>' + notes;
        return;
    }

    var grandExpected = { amount_lakh: 0, count: 0 };

    });

    var grandPipeline = { amount_lakh: 0, count: 0 };

    });

    m.plans.forEach(function(plan, i) {

        });

            html += '<span style="width:' + pct.toFixed(1) + '%;background:' + planColor(plan, i) + ';" title="' +
                escapeHtml(plan) + ': ' + cell.amount_lakh.toFixed(2) + ' L"></span>';

function dataSourceNotes(m, live) {

    var f = fieldInfo;
    var html = '<div class="data-source">' + live.deals.length + ' deals loaded; ' + m.periodDeals +
        ' match the selected filters. Amount: ' + escapeHtml(f.amount.label) + ' (' + escapeHtml(f.amount.api) +
        ', read as ' + amountUnitInUse + '). Plan: ' + escapeHtml(f.plan.label) + ' (' + escapeHtml(f.plan.api) +
        '). Product: ' + escapeHtml(f.product.label) + ' (' + escapeHtml(f.product.api) +
        '). Year: ' + escapeHtml(f.year.label) + ' (' + escapeHtml(f.year.api) + '). Quarter: ' +
        escapeHtml(f.closingDate) + '. Gist account owner: ' + escapeHtml(f.gist.label) + ' (' +
        escapeHtml(f.gist.api) + ').</div>';

    var warnings = [];

    if (live.deals.length > 0 && live.fyDealCount === 0) {
        warnings.push('No deal has Deal Year ' + FY_FILTER + '. Set <code>DEAL_FIELDS.year</code> at the top of ' +
            'the widget to your Deal Year field\'s API name.');
    }
    if (REQUIRE_CLOSING_DATE_IN_FY && live.outsideWindow > 0) {
        warnings.push(live.outsideWindow + ' deals have Deal Year ' + FY_FILTER + ' but a Closing Date outside ' +
            '1 Apr ' + FY_START_YEAR + ' - 31 Mar ' + (FY_START_YEAR + 1) + '. They are counted in the top cards ' +
            'but not in this table or the stage funnel. Correct their Closing Date in Zoho to include them here.');
    }
    if (!/expected ?business/i.test(f.amount.label + " " + f.amount.api.replace(/_/g, " "))) {
        warnings.push('No field named "Expected Business" was found on Deals, so amounts use "' +
            escapeHtml(f.amount.label) + '". Set <code>DEAL_FIELDS.amount</code> to the Expected Business API name.');
    }
    if (!f.product.found) {
        warnings.push('No Product field was found on Deals, so Current Pipeline cannot leave out ' +
            escapeHtml(PIPELINE_EXCLUDED_PRODUCTS.join(", ")) + '. Set <code>DEAL_FIELDS.product</code> to its API name.');
    }
    if (m.periodDeals > 0 && m.dealsWithAmount === 0) {
        warnings.push('Every deal amount is 0 in the field "' + escapeHtml(f.amount.label) + '". Set ' +
            '<code>DEAL_FIELDS.amount</code> to the API name of the field that holds expected business.');

    return html;

function stageColor(stage, index) {
    if (stage === CLOSED_LOST_STAGE) return "#dc2626";
    if (PAYMENT_RECEIVED_STAGES.indexOf(stage) !== -1 || stage === "Closed Won") return "#059669";
    if (PAYMENT_PENDING_STAGES.indexOf(stage) !== -1) return "#10b981";
    var blues = ["#1f4e78", "#1d5fa8", "#2563eb", "#3b82f6", "#60a5fa"];
    return blues[index % blues.length];
}


function renderStageFunnel(m) {

    var wrap = document.getElementById("stageFunnelWrap");
    if (!wrap) return;

    var stages = STAGE_ORDER.filter(function(s) { return m.stageTotals[s] && m.stageTotals[s].count > 0; });
    Object.keys(m.stageTotals).sort().forEach(function(s) {
        if (stages.indexOf(s) === -1) stages.push(s);
    });

    if (stages.length === 0) {
        wrap.innerHTML = '<div class="loading">No deals for the selected filters.</div>';
        return;
    }

    var maxAmount = Math.max.apply(null, stages.map(function(s) { return m.stageTotals[s].amount_lakh; }));
    var maxCount = Math.max.apply(null, stages.map(function(s) { return m.stageTotals[s].count; }));
    var useAmount = maxAmount > 0;

    var totalAmount = 0;
    var totalCount = 0;
    var html = '<div class="funnel">';

    stages.forEach(function(stage, i) {

        var t = m.stageTotals[stage];
        var ratio = useAmount ? t.amount_lakh / maxAmount : t.count / maxCount;
        var width = Math.max(3, Math.round(ratio * 100));

        totalAmount += t.amount_lakh;
        totalCount += t.count;

        html += '<div class="funnel-row clickable" data-cat="stage:' + escapeHtml(encodeURIComponent(stage)) + '" ' +
            'title="Click to see accounts">' +
            '<div class="funnel-stage">' + escapeHtml(stage) + '</div>' +
            '<div class="funnel-track"><div class="funnel-bar" style="width:' + width + '%;background:' +
            stageColor(stage, i) + ';"></div></div>' +
            '<div class="funnel-value"><span class="big">' + formatLakh(t.amount_lakh) + '</span>' +
            '<span class="small">' + t.count + (t.count === 1 ? ' deal' : ' deals') + '</span></div>' +
            '</div>';
    });

    html += '</div>';
    html += '<div class="funnel-total">All stages: <strong>' + formatLakh(totalAmount) + '</strong> across ' +
        totalCount + ' deals</div>';

    wrap.innerHTML = html;
}

   ACCOUNT OWNER SUMMARY
   Activity columns come from account_owner_report_reader (or are
   calculated live when a Gist account owner is selected).

   follow the quarter and Gist filters. They count accounts.

function loadAccountOwnerSummary() {

    var container = document.getElementById("accountOwnerSummarySection");

    ZOHO.CRM.FUNCTIONS.execute("account_owner_report_reader", { "arguments": JSON.stringify({}) })

        .then(function(response) {

            var data = findPayload(response);

            if (!data || !Array.isArray(data.owners)) {
                container.innerHTML = '<div class="error">Could not load Account Owner Summary.</div>';
                return;
            }

            lastAccountOwnerSummaryData = data;
            updateAccountOwnerSummaryDisplay();
        })

        .catch(function() {
            container.innerHTML = '<div class="error">Unable to load Account Owner Summary.</div>';
        });
}


function renderAccountOwnerSummary(data, selectedOwner) {

    var container = document.getElementById("accountOwnerSummarySection");

    var allOwners = data.owners || [];
    var isFiltered = selectedOwner && selectedOwner !== "All Owners";

    var visibleOwners = isFiltered
        ? allOwners.filter(function(o) {
            return String(o.owner_name || "").trim().toLowerCase() === selectedOwner.trim().toLowerCase();
        })
        : allOwners;

    if (isFiltered && visibleOwners.length === 0) {
        container.innerHTML = '<div class="loading">No Account Owner Summary data for ' + escapeHtml(selectedOwner) + '.</div>';
        return;
    }

    var PENDING = "…";

    function cell(count, ownerId, category) {
        if (count === PENDING) return '<td>' + PENDING + '</td>';
        count = count || 0;
        if (count > 0) {
            return '<td class="clickable plain" data-owner-id="' + escapeHtml(ownerId || "") + '" data-cat="' +
                escapeHtml(category) + '">' + count + '</td>';
        }
        return '<td>' + count + '</td>';
    }

    var html = '<div class="table-scroll"><table><thead><tr>';
    html += '<th style="text-align:left;">Account Owner</th><th>Total</th><th>Last 30</th>';
    html += '<th>31-60</th><th>60+</th><th>Touched</th><th>Non-Touched</th>';
    html += '<th>Closed Won</th><th>Closed Lost</th>';
    html += '</tr></thead><tbody>';

    var keys = ["total_accounts", "last_30", "days_31_60", "days_60_plus", "touched", "non_touched", "closed_won", "closed_lost"];
    var grand = {};
    keys.forEach(function(k) { grand[k] = 0; });
    var grandPending = false;

    visibleOwners.forEach(function(owner) {

        var ownerKey = String(owner.owner_name || "").trim().toLowerCase();
        var row = {
            total_accounts: owner.total_accounts,
            last_30: owner.last_30,
            days_31_60: owner.days_31_60,
            days_60_plus: owner.days_60_plus,
            touched: owner.touched,
            non_touched: owner.non_touched
        };

        if (aorLive && aorLive.gistActive && isGistHqName(owner.owner_name)) {
            var s = aorLive.gistStats;
            row = s ? {
                total_accounts: s.total, last_30: s.last_30, days_31_60: s.days_31_60,
                days_60_plus: s.days_60_plus, touched: s.touched, non_touched: s.untouched
            } : {
                total_accounts: PENDING, last_30: PENDING, days_31_60: PENDING,
                days_60_plus: PENDING, touched: PENDING, non_touched: PENDING
            };
        }

        if (aorLive) {
            var wl = aorLive.wonLost[ownerKey] || { won: {}, lost: {} };
            row.closed_won = Object.keys(wl.won).length;
            row.closed_lost = Object.keys(wl.lost).length;
        } else {
            row.closed_won = PENDING;
            row.closed_lost = PENDING;
        }

        html += '<tr><td class="row-label">' + escapeHtml(owner.owner_name) + '</td>';
        html += cell(row.total_accounts, owner.owner_id, "aor:total");
        html += cell(row.last_30, owner.owner_id, "aor:last_30");
        html += cell(row.days_31_60, owner.owner_id, "aor:days_31_60");
        html += cell(row.days_60_plus, owner.owner_id, "aor:days_60_plus");
        html += cell(row.touched, owner.owner_id, "aor:touched");
        html += cell(row.non_touched, owner.owner_id, "aor:non_touched");
        html += cell(row.closed_won, owner.owner_id, "aor:closed_won");
        html += cell(row.closed_lost, owner.owner_id, "aor:closed_lost");
        html += '</tr>';

        keys.forEach(function(k) {
            if (row[k] === PENDING) grandPending = true;
            else grand[k] += Number(row[k] || 0);
        });
    });

    if (!isFiltered) {
        html += '<tr class="grand-total"><td class="row-label">Grand Total</td>';
        keys.forEach(function(k) {
            var pendingCol = grandPending && (k === "closed_won" || k === "closed_lost") && !aorLive;
            html += '<td>' + (pendingCol ? PENDING : grand[k]) + '</td>';
        });
        html += '</tr>';
    }

    html += '</tbody></table></div>';

    container.innerHTML = html;

    container.querySelectorAll(".clickable").forEach(function(el) {
        el.onclick = function() {
            var row = el.closest("tr");
            var ownerName = row ? row.querySelector("td.row-label").innerText : "";
            openDrilldown(el.getAttribute("data-owner-id") || null, ownerName, el.getAttribute("data-cat"));
        };
    });
}

function zohoSearchAll(module, criteria) {

    return new Promise(function(resolve) {

        var allRecords = [];
        var page = 1;

        function fetchPage() {

            var searchPromise = criteria
                ? ZOHO.CRM.API.searchRecord({ Entity: module, Type: "criteria", Query: criteria, page: page, per_page: 200 })
                : ZOHO.CRM.API.getAllRecords({ Entity: module, sort_order: "asc", page: page, per_page: 200 });

            searchPromise
                .then(function(response) {

                    if (response && response.data) allRecords = allRecords.concat(response.data);

                    if (response && response.info && response.info.more_records === true && page < 150) {
                        page++;
                        fetchPage();
                    } else {
                        resolve(allRecords);
                    }
                })
                .catch(function(err) {
                    console.error(module + " fetch stopped on page " + page + ":", err);
                    resolve(allRecords);
                });
        }

        fetchPage();
    });
}


function ddLookupId(value) {
    if (value && typeof value === "object") return String(value.id || "");
    return String(value || "");
}


function ddLookupName(value, fallback) {
    if (value && typeof value === "object") return value.name || (fallback || "Unassigned");
    return fallback || "Unassigned";
}


/* Date-only values ("2026-04-01") are read as local dates, so 1 April stays in Q1 */
function ddParseDate(value) {
    if (!value) return null;
    var s = String(value).trim();
    var m = s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
    if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
    var d = new Date(s);
    return isNaN(d.getTime()) ? null : d;
}


function monthQuarter(date) {
    if (!date) return null;
    var month = date.getMonth() + 1;
    if (month >= 4 && month <= 6) return "Q1";
    if (month >= 7 && month <= 9) return "Q2";
    if (month >= 10 && month <= 12) return "Q3";
    return "Q4";
}


function attachDrilldownHandlers(ownerId, ownerName) {
    document.querySelectorAll("#content .clickable").forEach(function(el) {
        el.onclick = function() {
            var category = el.getAttribute("data-cat");
            if (category) openDrilldown(ownerId || null, ownerName, category);
        };
    });
}


function categoryLabel(category) {

    var labels = {
        "achieved": "Achieved (Closed Won)",
        "payment_received": "Payment Received",
        "payment_pending": "Payment Pending",
        "current_pipeline": "Current Pipeline",
        "total_accounts": "Total Accounts",
        "untouched": "Untouched Accounts",
        "touched": "Touched Accounts",
        "aor:total": "Total Accounts",
        "aor:last_30": "Touched in Last 30 Days",
        "aor:days_31_60": "Touched 31-60 Days Ago",
        "aor:days_60_plus": "Touched 60+ Days Ago",
        "aor:touched": "Touched Accounts",
        "aor:non_touched": "Non-Touched Accounts",
        "aor:closed_won": "Closed Won Accounts",
        "aor:closed_lost": "Closed Lost Accounts"
    };

    if (labels[category]) return labels[category];

    var parts = category.split(":");

    if (parts[0] === "bucket") return decodeURIComponent(parts[1]) + " - " + parts[2].replace(/_/g, " ");
    if (parts[0] === "qp") return decodeURIComponent(parts[1]) + " " + decodeURIComponent(parts[2]) + " Expected Business";
    if (parts[0] === "quarter_pipeline") return decodeURIComponent(parts[1]) + " Current Pipeline";
    if (parts[0] === "stage") return decodeURIComponent(parts[1]);

    return category;
}


function openDrilldown(ownerId, ownerName, category) {

    var modal = document.getElementById("drilldownModal");
    var title = document.getElementById("drilldownTitle");
    var body = document.getElementById("drilldownBody");

    title.innerText = (ownerName || "All Owners") + " - " + categoryLabel(category);
    body.innerHTML = "Loading...";
    modal.classList.add("open");

    runDrilldown(ownerId, ownerName, category)

        .then(function(names) {

            if (!names || names.length === 0) {
                body.innerHTML = '<div class="modal-empty">No matching records found.</div>';
                return;
            }

            var html = '<div class="modal-count">' + names.length + (names.length === 1 ? ' account' : ' accounts') + '</div><ul>';
            names.forEach(function(name) { html += "<li>" + escapeHtml(name) + "</li>"; });
            html += "</ul>";
            body.innerHTML = html;
        })

        .catch(function(err) {
            body.innerHTML = '<div class="modal-empty">Failed to load records.</div>';
            console.error("Drilldown error:", err);
        });
}


function closeDrilldown() {
    document.getElementById("drilldownModal").classList.remove("open");
}


function sortNames(names) {
    return names.sort(function(a, b) { return String(a).toLowerCase().localeCompare(String(b).toLowerCase()); });
}


var AOR_CATEGORY_MAP = {
    "aor:total": "total_accounts",
    "aor:touched": "touched",
    "aor:non_touched": "untouched",
    "aor:last_30": "aging:last_30",
    "aor:days_31_60": "aging:days_31_60",
    "aor:days_60_plus": "aging:days_60_plus",
    "aor:closed_won": "won_accounts",
    "aor:closed_lost": "lost_accounts"
};


async function runDrilldown(ownerId, ownerName, category) {

    var live = await loadLiveData();

    if (!ownerId && ownerName && ownerName !== "All Owners") {
        ownerId = live.ownerIdByName[ownerName.trim().toLowerCase()] || "__no_owner__";
    }

    if (AOR_CATEGORY_MAP[category]) category = AOR_CATEGORY_MAP[category];

    var parts = category.split(":");
    var kind = parts[0];
    var selectedQuarter = currentQuarterSelection();
    var gistSelection = currentGistSelection();

    var dealKinds = ["qp", "quarter_pipeline", "stage", "won_accounts", "lost_accounts"];

    if (CARD_CATEGORIES.indexOf(category) !== -1 || dealKinds.indexOf(kind) !== -1) {

        var unique = {};

        live.deals.forEach(function(deal) {

            var isCard = CARD_CATEGORIES.indexOf(category) !== -1;
            var ctx = dealContext(deal, live, selectedQuarter, gistSelection, isCard);
            if (!ctx) return;

            var ok = false;

            if (isCard) {
                ok = matchesCardCategory(ctx, category, ownerId);
            } else if (matchesAccountOwner(ctx, ownerId)) {
                if (kind === "qp") {
                    ok = ctx.quarter === decodeURIComponent(parts[1]) &&
                        ctx.plan === decodeURIComponent(parts[2]) && countsAsExpected(ctx);
                } else if (kind === "quarter_pipeline") {
                    ok = ctx.quarter === decodeURIComponent(parts[1]) && isPipelineDeal(ctx);
                } else if (kind === "stage") {
                    ok = ctx.stage === decodeURIComponent(parts[1]);
                } else if (kind === "won_accounts") {
                    ok = isClosedWonStage(ctx.stage) && !ctx.excluded;
                } else if (kind === "lost_accounts") {
                    ok = ctx.stage === CLOSED_LOST_STAGE;
                }
            }

            if (ok) unique[ctx.accId] = ctx.accName;
        });

        return sortNames(Object.values(unique));
    }

    var accounts = filterAccounts(live, ownerId, gistSelection);

    if (category === "total_accounts") {
        return sortNames(accounts.map(function(a) { return a.name; }));
    }

    var calls = await getOwnerCalls(ownerId);
    var latest = latestOwnerCalls(accounts, calls);
    var matches = [];

    accounts.forEach(function(account) {

        var lastCall = latest[account.id];
        var age = lastCall ? agingOf(lastCall) : null;
        var isMatch = false;

        if (category === "untouched") {
            isMatch = !lastCall;
        } else if (category === "touched") {
            isMatch = !!lastCall;
        } else if (kind === "aging") {
            isMatch = age === parts[1];
        } else if (kind === "bucket") {
            if (account.bucket === decodeURIComponent(parts[1])) {
                if (parts[2] === "Total") isMatch = true;
                else if (parts[2] === "non_touched") isMatch = !lastCall;
                else isMatch = age === parts[2];
            }
        }

        if (isMatch) matches.push(account.name);
    });

    return sortNames(matches);
}


function escapeHtml(value) {
    if (value === undefined || value === null) return "";
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}
